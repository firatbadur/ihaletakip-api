# ═══════════════════════════════════════════════════════
#  IhaleTakip API — Docker Compose (Ubuntu üretim)
#  Servisler: db (postgres), redis, web (gunicorn), nginx,
#             worker (celery), ekap-worker, beat (celery beat)
#
#  Ortam dosyası: .env.prod  (bkz. .env.example → kopyalayıp doldur)
#  Çalıştırma:    docker compose up -d --build
#  Dışa açılan tek port: 443 (nginx). Cloudflare 443 → origin:443 (varsayılan).
# ═══════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_DB/USER/PASSWORD .env.prod'dan gelir (tek kaynak → DATABASE_URL ile tutarlı)
    env_file: .env.prod
    # ⚠️ Docker /dev/shm'i varsayılan 64 MB verir → paralel sorgu ve büyük hash/sort
    # işlemleri "could not resize shared memory segment" ile patlar.
    shm_size: 512mb
    # ── Tuning (bkz. CLAUDE.md → "Postgres tuning") ────────────────────────────
    # Varsayılan postgres yapılandırması 500k+ satırlık `ekap_tender` için fazla küçük:
    # shared_buffers=128MB, work_mem=4MB, random_page_cost=4.0 (SSD için yanlış).
    #
    # ⚠️ Değerler BURAYA yazılır, `.env.prod`'a DEĞİL. Compose'un `${VAR}` ikamesi
    # `env_file:`'dan okumaz (o yalnızca konteyner içi ortam değişkeni tanımlar) —
    # kabuk ortamından ya da `.env` dosyasından okur. `.env.prod`'a yazılan bir
    # PG_* değeri sessizce yok sayılır, bu yüzden doğrudan buraya gömülüdür.
    #
    # Aşağıdakiler bu sunucunun donanımı içindir: **8 GB RAM · 4 çekirdek · RAID10 SSD**.
    # Sunucu değişirse `free -g` / `nproc` ile bakıp tabloya göre düzenleyin:
    #   Parametre               |  4 GB  |  8 GB  | 16 GB
    #   ------------------------|--------|--------|-------
    #   shared_buffers          |  512MB |  2GB   |  4GB
    #   effective_cache_size    | 1536MB |  5GB   | 11GB
    #   work_mem                |  8MB   | 16MB   | 32MB
    #   maintenance_work_mem    |  256MB | 512MB  |  1GB
    #   max_wal_size            |  2GB   |  4GB   |  8GB
    #   shm_size                |  256mb | 512mb  |  1gb
    # shared_buffers'ı RAM'in ~%25'inde tutun: bu makinede Postgres yalnız değil —
    # web(3 gunicorn) + worker(4 celery) + ekap-worker + beat + redis + nginx ≈ 2 GB.
    # Kalan ~4 GB OS sayfa cache'ine gider; `effective_cache_size` planlayıcıya
    # "shared_buffers + OS cache" toplamını söyler (bellek ayırmaz, sadece tahmindir).
    # `docker stats` ile gerçek tüketimi doğrulayın.
    #
    # ⚠️ shared_buffers ve shared_preload_libraries runtime'da değişmez → db yeniden başlar.
    command:
      - postgres
      # Ölçüm: en pahalı sorguları sıralamak için (bkz. CLAUDE.md ölçüm bölümü)
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      # Bellek
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      # Planlayıcı — RAID10 SSD. ⚠️ Dönen disk (lsblk ROTA=1) ise random_page_cost=4.0
      # ve effective_io_concurrency=2 yapın, yoksa planlayıcı indeksleri fazla sever.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # LIKE seçicilik tahminleri 500k satırda varsayılan 100 ile isabetsiz kalıyor
      - -c
      - default_statistics_target=200
      # Paralel sorgu — 4 çekirdek. COUNT ve büyük taramalar bölünebilsin, ama tek sorgu
      # tüm çekirdekleri yutup diğer istekleri bekletmesin (per_gather=2).
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      # WAL — backfill sürekli yazıyor, sık checkpoint I/O dalgası yaratıyor
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      # Bu süreyi (ms) aşan sorgular loga yazılır → `docker compose logs db | grep duration`
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ihale}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./credentials:/app/credentials:ro
    # Doğrudan dışa açılmaz — yalnızca nginx üzerinden erişilir (iç ağ).
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      # entrypoint migrate+collectstatic tamamlanana kadar sağlıksız sayma.
      # Dolu tabloda ağır bir data-migration'ı (backfill) entrypoint'in çalıştırması
      # bu pencereyi aşabilir → o durumda migrate'i ELLE çalıştır (bkz. CLAUDE.md).
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Cloudflare Origin Certificate (cf-origin.pem + cf-origin.key) — sunucuda oluşturulur.
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      # Dışa açılan tek port. Cloudflare 443 (SSL) → origin:443 (nginx TLS, Full-strict).
      - "443:443"
    depends_on:
      web:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      RUN_MIGRATIONS: "false"
    # Genel kuyruk (ekap hariç) — ai analiz, bildirim vb.
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "celery", "--concurrency=4"]
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      - web
      - redis

  ekap-worker:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      RUN_MIGRATIONS: "false"
    # EKAP kuyruğu.
    # ⚠️ **Concurrency 1 DEĞİL 3 — ama EKAP'a giden yük DEĞİŞMEZ.** Hız sınırı artık
    # `ekap/throttle.py`'de **atomik** olarak uygulanıyor (Redis SETNX ile pencere
    # rezervasyonu, worker'lar arası koordineli) → kaç worker olursa olsun EKAP saniyede
    # yalnızca `EKAP_MIN_INTERVAL_MS`'te bir istek görür.
    #
    # Neden 1 yetmiyordu (ölçüm 2026-08): EKAP yanıt süresi ~1,8 sn. Tek worker'da bu
    # süre throttle'ın 1 sn'siyle SERİ toplanıyor → istek başına ~2,8 sn → 0,36 istek/sn,
    # yani 1 istek/sn bütçesinin yalnızca %36'sı kullanılıyordu. Birden çok worker ile
    # EKAP beklemeleri ÖRTÜŞÜR ve bütçe tam kullanılır (~2,8× verim).
    # 3 sayısı: boru hattını dolu tutmak için ceil(yanıt_süresi / aralık) + 1 ≈ 3.
    # Daha fazlası kazanç getirmez (throttle tavanı) — yalnızca boşta bağlantı tutar.
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "ekap", "--concurrency=3"]
    depends_on:
      - web
      - redis

  beat:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      - web
      - redis

volumes:
  pgdata:
  redisdata:
  static_volume:
  media_volume:
