    - tur: fotograf
      ad: "sayac.png"
      metin: "SAYAC NO: 48213\nENDEKS: 0072519"
  icermeli: ["48213"]
  icermemeli: ["**"]
  not: >
    Fotoğraf okuma (Files API görsel yolu): yazıyı okumalı.

