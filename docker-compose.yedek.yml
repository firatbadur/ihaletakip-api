# ─────────────────────────────────────────────────────────────────────────────
# ACİL YEDEK SUNUCU katmanı (tinyfect-yedek, 45.13.59.169) — 2026-11-11
#
# Ana sunucu (173.249.43.236) RAM arızasıyla çöktü (IPMI: DIMMC2 + DIMMB1).
# Canlı geçici olarak bu sunucuda. Kullanım (tinyfect katmanı YERİNE):
#   docker compose -f docker-compose.yml -f docker-compose.yedek.yml up -d
#
# ⚠️ Donanım: 8 GB RAM · 4 çekirdek · Tinyfect'in kendi yığını da burada (~2 GB).
# Ana dosyadaki Postgres değerleri zaten 8 GB'lık eski Bursa sunucusuna göre;
# burada Tinyfect payı için biraz daha kısıldı. tinyfect katmanı (32 GB shared_buffers)
# bu makinede Postgres'i HİÇ açmaz.
# ⚠️ Worker eşzamanlılıkları düşürüldü: ana dosyadaki değerlerle ~25 Django süreci
# 8 GB'ı aşar ve OOM Tinyfect'i de düşürür.
# ⚠️ Yetim ek süpürmesi (ASSISTANT_EK_YETIM_SUPURME) burada KAPALI: veritabanı
# 04:00 dump'ından geldi; ana sunucunun 14 saatlik penceresinde yüklenen ekler
# bu DB'de yok → süpürme onları "yetim" sanıp Files API'den silerdi.
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    # Ana sunucunun çalıştırdığı imajla aynı (PG 16.14) — tinyfect katmanındaki digest.
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    shm_size: 512mb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_statistics_target=200
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=1000

  web:
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "3", "--threads", "2", "--worker-class", "gthread",
              "--max-requests", "1000", "--max-requests-jitter", "100", "--timeout", "180"]
    environment:
      # ⚠️⚠️ Eski sunucu token'ı koruması (2026-11-12) — gerekçe config/settings.py.
      # 714+ ID'ler ana sunucuda boşluk saatlerinde BAŞKA kişilere verildi, yedek de aynı
      # numaraları yeniden dağıttı (sayaç 12.11'de 10000'e atlatıldı). Aralıktaki
      # kullanıcıların SINIR'dan önceki token'ları reddedilir. SINIR = bu korumanın
      # devreye girdiği an; DEĞİŞTİRMEYİN (ileri alınırsa meşru kullanıcılar yeniden
      # atılır, geri alınırsa araya sızmış token'lar geçer).
      ESKI_TOKEN_UID_MIN: "714"
      ESKI_TOKEN_UID_MAX: "9999"
      ESKI_TOKEN_IAT_SINIRI: ""

  nginx:
    volumes:
      # Yedek sunucuya özel nginx: Pinmotion blokları yok (Pinmotion burada çalışmıyor).
      - ./docker/nginx/yedek.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "celery", "--concurrency=2",
              "--max-memory-per-child=400000"]

  ekap-worker:
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "ekap", "--concurrency=3",
              "--max-memory-per-child=400000"]

  ekap-priority-worker:
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "ekap_oncelik", "--concurrency=2",
              "--max-memory-per-child=400000"]

  assistant-worker:
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "assistant", "--concurrency=1",
              "--prefetch-multiplier=1", "--max-memory-per-child=400000"]

  assistant-ek-worker:
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "assistant_ek", "--concurrency=1",
              "--prefetch-multiplier=1"]
    mem_limit: 1500m
