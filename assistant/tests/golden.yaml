  icermemeli: ["**"]
  not: >
    Madde sorusu: oran VE madde numarası verilmeli (Madde 9). Model oranı "yüzde 3"
    diye de yazıyor (2026-11-11 üretim çalıştırması) — ikisi de doğru.

- soru: "Bu işte iş deneyim belgesinin tutarı ne kadar olmalı?"
  ekler:
    - tur: dokuman
      ad: "TEKNİK ŞARTNAME.txt"
      metin: |
        TEKNİK ŞARTNAME — Okul Binası Çatı Onarımı İşi
        
        Madde 1 - İşin konusu: Atatürk İlkokulu binasının çatı örtüsünün sökülerek yenilenmesi.
        Madde 3 - İşin yapılacağı yer: Çankaya / Ankara.
        Madde 5 - İşin süresi: Yer tesliminden itibaren 90 (doksan) takvim günüdür.
        Madde 7 - İstenen belgeler: İş deneyim belgesi, ticaret sicil gazetesi, imza sirküleri.
