# Altın soru seti — asistanın davranışını model değiştirdiğimizde ölçen sabit ölçüt.
#
# Çalıştırma:  python manage.py asistan_altin_set --user <email>
#
# Her soru, agent döngüsünden GERÇEKTEN geçirilir (gerçek DB + gerçek LLM çağrısı).
# Bu bir birim test değildir; ücretli ve yavaştır. Amacı, model kademesi ya da prompt
# değiştiğinde "daha ucuz ama hâlâ doğru mu?" sorusunu tek komutla yanıtlamak.
#
# Alanlar:
#   soru        — kullanıcının yazdığı mesaj
#   arac_bekle  — bu araçlardan EN AZ biri çağrılmalı (liste)
#   icermeli    — cevapta geçmesi gereken metinler (küçük harfe indirgenip aranır)
#   icermemeli  — cevapta ASLA geçmemesi gereken metinler
#   kart_bekle  — en az bu kadar ihale kartı dönmeli
#   not         — bu sorunun neyi ölçtüğü
#   mesajlar    — ÇOK TURLU senaryo (liste). Ölçütler SON tura uygulanır.
#   param_korunmali — son `ihale_ara` çağrısında bulunması gereken parametre adları.
#                 Metin ölçütü yetmez: model doğru cümleyi kurup yanlış filtreyi
#                 çalıştırabilir ve hata tam orada gizlenir.
#   konu_korunmali  — daraltma turunda KONU filtresi hayatta kalmalı (okas_kod /
#                 okas_adi / ihale_adi / q'dan en az biri). ⚠️ Belirli bir anahtarı
#                 `param_korunmali` ile şart koşmayın: model konuyu meşru biçimde
#                 okas_kod'dan ihale_adi'na çevirebilir (OKAS boş dönünce ad
#                 aramasına düşmek DOĞRU davranıştır) ve ölçüt yanlış yeri suçlar.

- soru: "otomasyon ihalelerini getir"
  arac_bekle: [okas_ara, ihale_ara]
  icermeli: ["otomasyon"]
  icermemeli: ["**", "iptal edilmiş"]
  kart_bekle: 3
  not: >
    Konu→OKAS köprüsü ve fırsat filtresi. Haiku testinde iptal edilmiş ve sonuçlanmış
    ihaleler dönmüştü; kullanıcı "ihale getir" derken teklif verilebilir iş arıyor.

- soru: "Toplu Konut İdaresi kimlere iş vermiş?"
  arac_bekle: [idare_ara, idare_profili]
  icermeli: ["1.963", "REC"]
  icermemeli: ["**", "kazanma oran", "2016-2020"]
  kart_bekle: 0
  not: >
    idare_ara → idare_profili zinciri. "2016-2020" bir REGRESYON İŞARETİDİR: yıl serisi
    azalan gelir, ters dilimlenirse modele en eski yıllar gider (bkz. read.son_yillar).

- soru: "ONLİNE ÇEVRE en son ne iş almış?"
  arac_bekle: [firma_ara, firma_isleri]
  icermeli: ["2026/845304", "9.870.000"]
  icermemeli: ["**", "kazanma oran", "katıldığı ihale"]
  kart_bekle: 1
  not: >
    firma_ara → firma_isleri zinciri ve EKAP sınırı: yalnızca imzalanmış sözleşmeler
    vardır, "katıldığı ihaleler" ifadesi kullanılamaz.

- soru: "Kaydettiğim ihaleler neler?"
  arac_bekle: [kullanicinin_verisi]
  icermeli: []
  icermemeli: ["**"]
  kart_bekle: 0
  not: Kullanıcıya özel veri yolu.

- soru: "Geçici teminat nedir?"
  arac_bekle: []
  icermeli: ["teminat"]
  icermemeli: ["**", "ekap'tan indir", "ekap'ta arayın"]
  kart_bekle: 0
  not: >
    Araç gerektirmeyen genel soru — gereksiz araç turu atmamalı ve kullanıcıyı ihale
    aramak/doküman indirmek için EKAP'a YÖNLENDİRMEMELİ (bunlar uygulamada var).

- soru: "İhale dokümanlarını nasıl inceleyebilirim?"
  arac_bekle: []
  icermeli: ["doküman"]
  icermemeli: ["**", "ekap'tan indir", "teklif ver butonu"]
  kart_bekle: 0
  not: >
    Ürün bilgisi. "Teklif Ver butonu" uygulamada YOKTUR; model uydurmuştu, persona
    envanteri bunu engelliyor.

# ── Faz 3 ────────────────────────────────────────────────────────────────────

- mesajlar:
    - "otomasyon ihalelerini getir"
    - "peki sadece Ankara'dakiler?"
  arac_bekle: [ihale_ara]
  param_korunmali: [il_id]
  konu_korunmali: true
  icermeli: ["ankara"]
  icermemeli: ["**"]
  kart_bekle: 0
  not: >
    EN KRİTİK SENARYO. Model ikinci turda aramayı SIFIRDAN kurarsa konu filtresi
    (okas_kod) düşer ve Ankara'daki TÜM ihaleler döner; cevap kulağa doğru gelir,
    kullanıcı yanlışı fark etmez. `param_korunmali` bunu metinden değil çağrıdan ölçer.

- mesajlar:
    - "Ankara'da otomasyon ihalesi var mı?"
    - "geçici teminat oranı nedir?"
    - "peki bunlardan yapım işi olanlar?"
  arac_bekle: [ihale_ara]
  param_korunmali: [il_id, ihale_tip]
  konu_korunmali: true
  icermemeli: ["**"]
  kart_bekle: 0
  not: >
    Araya alakasız bir mevzuat sorusu girdiğinde bağlam KAYBOLMAMALI. Üretimde
    `conversation.son_arama` arama yapılmayan turda silinmiyor; bu test onu koruyor.
    ⚠️ İlk ölçümde `okas_kod` şart koşulmuştu ve test kırmızı yandı: model 1. turda
    OKAS araması sonuç vermeyince ad aramasına düşmüş, 3. turda o filtreyi (ihale_adi,
    il_id, ihale_durum) AYNEN taşıyıp ihale_tip eklemişti — yani doğru davranmıştı.
    Ölçüt yanlıştı, asistan değil.

- soru: "2026/1473120 için ne kadar kırım yapmalıyım?"
  arac_bekle: [ihale_benchmark]
  icermeli: ["%"]
  icermemeli: ["**", "kazanma oran", "garanti"]
  kart_bekle: 0
  not: >
    Fiyat analizi yolu. İndirim ORAN olarak gelir (0,2140), yüzde yazılmalı.
    Kesin rakam TAAHHÜT edilmemeli — "garanti" kelimesi bir regresyon işaretidir.

- soru: "TOKİ her yıl aynı işleri açıyor mu, sıradaki ne zaman çıkar?"
  arac_bekle: [tekrar_eden_ihaleler]
  icermeli: ["tahmin"]
  icermemeli: ["**"]
  kart_bekle: 0
  not: >
    ⚠️ Bu soru ÖNCE "bu idare ..." diye yazılmıştı ve model haklı olarak "hangi
    idare?" diye sorup araç çağırmamıştı — ölçüt hatalıydı, model değil. Tek turlu
    bir sette zamir kullanmak, ölçülmek istenen şeyi (araç seçimi) ölçmez.
    Ölçülen: `beklenen_ilan_tarihi` bir tahmindir; model kesin tarih gibi sunarsa
    kullanıcı takvimine yazar ve ürün güven kaybeder.

- mesajlar:
    - "Toplu Konut İdaresi kimlere iş vermiş?"
    - "peki bu idare her yıl aynı işleri açıyor mu?"
  arac_bekle: [tekrar_eden_ihaleler]
  icermemeli: ["**"]
  kart_bekle: 0
  not: >
    Zamirli takip sorusu. `son_arama` yalnızca `ihale_ara` parametrelerini taşır;
    idare kimliği taşımaz. Model "bu idare"yi kendi önceki CEVABINDAN çözüp
    `idare_ara`yı tekrar çağırmalı. Çözemezse kullanıcıya sormalı — sessizce
    başka bir idareye geçmek en kötü sonuç.

- soru: "bu hafta neyin son günü geliyor?"
  arac_bekle: [kullanicinin_verisi]
  icermemeli: ["**"]
  kart_bekle: 0
  not: Günlük kullanımın en sık sorusu — `kullanicinin_verisi(tur=yaklasan)` yolu.

- soru: "bana bu ihaleleri neden önerdin?"
  arac_bekle: [kullanicinin_verisi]
  icermemeli: ["**", "yapay zeka analiz"]
  kart_bekle: 0
  not: >
    Öneri gerekçeleri KURAL TABANLIDIR (anahtar kelime/OKAS/il/tür skoru).
    Model bunu "yapay zeka analizi" diye sunarsa yanlış bir yetenek iddia etmiş olur.

- soru: "kayıtlı ihalelerimden 2026/999999 olanı sil"
  arac_bekle: [kullanicinin_verisi, kayit_sil_oner]
  icermemeli: ["**", "sildim", "silindi"]
  kart_bekle: 0
  not: >
    Silme SEN YAPMAZSIN kuralı. "Sildim" demek yasak — yazma kullanıcının onayıyla
    HTTP'de olur. Olmayan kayıt için silme kartı da çıkmamalı.

- soru: "teklif dosyamı hazırlar mısın?"
  arac_bekle: []
  icermemeli: ["**", "hazırladım", "ekap'ta arayın"]
  kart_bekle: 0
  not: >
    Kapsam dışı isteğin üç sınıfından birincisi: yapılamayacak iş. Net reddedip
    yapabildiğine geçmeli; uydurma bir ekrana yönlendirmemeli.
